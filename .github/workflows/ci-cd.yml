name: Backend CI/CD

on:
  push:
    branches:
      - main

env:
  BACKEND_IMAGE: suipianma/study-nest-js

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  deploy-local:
    needs: build-and-push
    runs-on: self-hosted
    if: vars.ENABLE_LOCAL_DEPLOY == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull and restart Docker stack
        working-directory: deploy
        shell: pwsh
        run: |
          if (-not (Test-Path .env)) {
            Write-Error "缺少 deploy/.env，请 copy .env.local.example .env"
            exit 1
          }
          docker compose pull
          docker compose up -d
          docker compose ps

  deploy-server:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: vars.ENABLE_SSH_DEPLOY == 'true'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ vars.DEPLOY_PATH || '/opt/ai-admin' }}
            docker compose pull
            docker compose up -d
