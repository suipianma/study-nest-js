version: '3.8'

services:
  app:
    build: .

    ports:
      - '3000:3000'

    env_file:
      - .env

    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: qwer1234

      MYSQL_DATABASE: ai_admin

  redis:
    image: redis:7

    ports:
      - '6379:6379'